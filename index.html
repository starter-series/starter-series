<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starter Series has moved</title>
  <meta name="description" content="This legacy landing-page repo now points to the canonical Starter Series site.">
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://starter-series.github.io/starter-series/">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0e1117;
      --fg: #f5f7fb;
      --muted: #9aa4b2;
      --border: rgba(255, 255, 255, .14);
      --panel: rgba(255, 255, 255, .06);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f7fb;
        --fg: #1d2430;
        --muted: #5f6b7a;
        --border: rgba(15, 23, 42, .14);
        --panel: rgba(255, 255, 255, .75);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    main {
      width: min(100%, 640px);
      padding: 32px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
    }

    p {
      color: var(--muted);
      line-height: 1.65;
    }

    a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      margin-top: 12px;
      color: inherit;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <p>Legacy surface</p>
    <h1>Starter Series now lives in the canonical hub.</h1>
    <p>
      This repo is retained only as a redirect notice. The current public site,
      baseline inventory, and service-completion evidence live in
      <code>starter-series/starter-series</code>.
    </p>
    <a href="https://starter-series.github.io/starter-series/">Open the canonical site</a>
  </main>
</body>
</html>
